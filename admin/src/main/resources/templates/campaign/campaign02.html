<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <th:block th:replace="~{fragments/csrfFragments :: metaCsrf}"></th:block>
        <title>캠페인 수정</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="admin-container">
            <div th:if="${user} == 'semiAdmin'">
                <div th:replace="~{fragments/sidebar :: sidebarFragment-semi}"></div>
            </div>
            <div th:unless="${user} == 'semiAdmin'">
                <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>
            </div>
            <div class="main-content">
                <h1>캠페인 수정</h1>
                <form class="form" th:action="@{/campaign05}" method="post" id="form" enctype="multipart/form-data">
                    <div th:replace="~{fragments/csrfFragments :: inputCsrf}"></div>

                    <input type="hidden" name="campaignId" id="campaignId" th:value="${campaignSelect.campaignId}" />

                    <div class="form-row">
                        <div class="form-group">
                            <label for="businessName">업체명</label>
                            <input type="text" name="companyNm" id="companyNm" th:value="${campaignSelect.companyNm}" />
                        </div>
                        <div class="form-group">
                            <label for="mainPhone">고객 연락처</label>
                            <input type="text" name="companyPh" id="companyPh" th:value="${campaignSelect.companyPh}" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>캠페인명</label>
                            <input type="text" id="campaignTitle" name="campaignTitle" th:value="${campaignSelect.campaignTitle}"/>
                        </div>
                    </div>
                    <!-- ⭐️ form 대신 div로 변경하여 중첩 폼 문제 해결 ⭐️ -->
                    <div id="leaderSection" class="form-row" style="flex-direction: column; width: 100%;">
                        <button type="button" onclick="addLeaderForm()">+ 인솔자 추가하기</button>
                        <template id="leaderTemplate">
                            <div class="leader-form-group mgt16">
                                <input type="hidden" class="leaderCode" name="leaderList[].leaderCode" />
                                <input type="hidden" class="leaderId" name="leaderList[].leaderId" />
                                <input type="hidden" class="leaderNo" name="leaderList[].leaderNo" />
                                <input type="hidden" class="leaderPay" name="leaderList[].leaderPay" />
                                <input type="hidden" class="leaderPoint" name="leaderList[].leaderPoint" />

                                <div class="form-row">
                                    <div class="form-group">
                                        <label>인솔자 선택</label>
                                        <select id="leaderNm_pc" name="leaderList[].leaderNm" onchange="inputLeaderPhoneNumber(this)" class="sync-nm">
                                            <option value="">-- 선택하세요 --</option>
                                            <option th:each="leader, stat : ${leaderList}"
                                                    th:value="${stat.index}"
                                                    th:text="${leader.userNm}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>인솔자 연락처</label>
                                        <input type="text" name="leaderList[].leaderPh" class="sync-phone" readonly/>
                                    </div>
                                    <div class="form-group pc">
                                        <label>인솔자 급여</label>
                                        <input type="text" class="sync-pay-pc" oninput="syncPay(this)" />
                                    </div>
                                    <div class="form-group pc">
                                        <label>인솔자 포인트</label>
                                        <input type="text" class="sync-point-pc" oninput="syncPoint(this)" />
                                    </div>
                                    <div class="form-group pc">
                                        <button type="button" class="remove_leader" onclick="removeLeaderForm(this)">삭제</button>
                                    </div>
                                </div>
                                <div class="form-row mobile">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>인솔자 급여</label>
                                            <input type="number" class="sync-pay-mo" oninput="syncPay(this)" />
                                        </div>
                                        <div class="form-group">
                                            <label>인솔자 포인트</label>
                                            <input type="text" class="sync-point-mo" oninput="syncPoint(this)" />
                                        </div>
                                        <button type="button" class="remove_leader" onclick="removeLeaderForm(this)">삭제</button>
                                    </div>
                                </div>
                            </div>
                        </template>
                        <div id="leaderContainer"></div>
                    </div>
                    <div class="form-row mobile" style="border: black;border: solid;border-bottom: 1px; margin: 0px;"></div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>포인트 유형</label>
                            <!-- <input type="text" id="campaignTitle" name="campaignTitle" /> -->
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="ucChoice" id="campPay" value="01" th:checked="${campaignSelect?.ucChoice == null || campaignSelect?.ucChoice == '01'}">캠페인
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="ucChoice" id="userPay" value="02" th:checked="${campaignSelect?.ucChoice == '02'}">유저
                                </label>
                            </div>
                        </div>
                    <div class="form-group">
                            <label>주간 / 야간</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="timeSegment" id="timeSegmentDay" value="DAY" th:checked="${campaignSelect?.timeSegment == null || campaignSelect?.timeSegment == 'DAY'}">주간
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="timeSegment" id="timeSegmentNight" value="NIGHT" th:checked="${campaignSelect?.timeSegment == 'NIGHT'}">야간
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <th:if></th:if>
                            <label for="securityType" id="roleType">경호/진행/수행</label>
                            <select id="securityType" name="securityType" onchange="securityTypeChange(this.value)">
                                <option value="">-- 선택하세요 --</option>
                                <option th:each="type : ${securityType}"
                                        th:value="${type.code}"
                                        th:text="${type.codeName}"></option>
                            </select>
                            <input type="hidden" id="typeCode" name="typeCode" />
                        </div>
                        <div class="form-group hidden" id="wageRadio">
                            <label for="">시급 일급</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="wageChk" id="dailyWage" value="01"
                                        th:checked="${campaignSelect?.wageChk == null || campaignSelect?.wageChk == '01'}">일급
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="wageChk" id="hourlyWage" value="02"
                                        th:checked="${campaignSelect?.wageChk == '02'}">시급
                                </label>
                            </div>
                        </div>
                        <div class="form-group" id="dailyPay">
                            <label for="campaignPay">캠페인 급여</label>
                            <input type="text" id="dailyPayInput" name="campaignPay" th:value="${campaignSelect.campaignPay}" />
                        </div>

                    </div>
                    <div class="form-row">
                        <div class="form-group hidden" id="hourlyPay">
                            <label for="campaignPay">캠페인 시급여</label>
                            <input type="text" id="hourlyPayInput" th:value="${campaignSelect.campaignPay}"/>
                        </div>
                        <div class="form-group hidden" id="timeInput">
                            <label for="WorkHour">하루 근무 시간</label>
                            <input type="number" name="workHour" id="workHour" placeholder="예: 8" min="1" th:value="${campaignSelect.workHour}">
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-group">
                            <label>캠페인 이미지</label>
                            <div id="existing-file-section" th:classappend="${file == null} ? 'hidden'">
                                <div class="mrg_auto">
                                    <img class="campaign_image" id="imgFile" th:src="@{/img(id=${campaignSelect.campaignId})}" alt="파일이미지" />
                                </div>
                                <button type="button" style="margin-top: 10px; background-color: #aaa; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;"
                                        th:onclick="removeFile(this, [[${campaignSelect.campaignId}]])">기존 이미지 삭제</button>
                            </div>

                            <div id="drop-area" th:classappend="${file != null} ? 'hidden'" style="border: 2px dashed #b594ff; padding: 20px; text-align: center; border-radius: 8px;">
                                <p>이미지를 클릭하거나 끌어다 놓으세요</p>
                                <div>
                                    <input type="file" name="image" id="image" accept="image/*" style="display: none" />
                                    <img id="preview" src="" alt="미리보기" class="hidden" style="max-width: 100%; margin-top: 10px;" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>모집 인원 수</label>
                            <input type="number" name="recruitmentNum" id="recruitmentNum" th:value="${campaignSelect.recruitmentNum}" />
                        </div>
                        <div class="form-group">
                            <label for="placeAddr">주소</label>
                            <input type="text" name="placeAddr" id="placeAddr" th:value="${campaignSelect.placeAddr}" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label>안내사항</label>
                        <textarea class="memo" name="mission" id="mission" rows="12" th:text="${campaignSelect.mission}"></textarea>
                    </div>

                    <input type="hidden" name="eventPeriodStr" id="eventPeriodStr" />
                    <input type="hidden" name="eventPeriodEnd" id="eventPeriodEnd" />
                    <input type="hidden" name="resultDate" id="resultDate" />

                    <div class="form-row">
                        <div class="form-group">
                            <label>신청기간</label>
                            <div class="form-row">
                                <input class="dateInsert" type="date" name="AppPeriodStr" id="AppPeriodStr" th:value="${campaignSelect.AppPeriodStr}" />
                                <input class="dateInsert" type="date" name="AppPeriodEnd" id="AppPeriodEnd" th:value="${campaignSelect.AppPeriodEnd}" />
                            </div>
                        </div>
                        <div class="form-group pc">
                            <label>행사기간</label>
                            <div class="form-row">
                                <input class="dateInsert sync-event-str" type="date" id="eventPeriodStr_pc" />
                                <input class="dateInsert sync-event-end" type="date" id="eventPeriodEnd_pc" />
                            </div>
                        </div>
                        <div class="form-group pc">
                            <label>명단발표기간</label>
                            <div class="form-row">
                                <input class="dateInsert sync-event-rst" type="date" id="resultDate_pc" />
                            </div>
                        </div>
                    </div>

                    <div class="form-row mobile">
                        <div class="form-group">
                            <label>행사기간</label>
                            <div class="form-row">
                                <input class="dateInsert sync-event-str" type="date" id="eventPeriodStr_mo" />
                                <input class="dateInsert sync-event-end" type="date" id="eventPeriodEnd_mo" />
                            </div>
                        </div>
                    </div>
                    <div class="form-row mobile">
                        <div class="form-group">
                            <label>명단발표기간</label>
                            <input class="dateInsertRst sync-event-rst" type="date" name="resultDate_mo" id="resultDate_mo" />
                        </div>
                    </div>

                    <!-- ⭐️ 하단 버튼 3개 배치 (방법 B 적용) ⭐️ -->
                    <div class="form-row" style="margin-top: 24px; gap: 12px;">
                        <!-- <button type="button" class="btn-leader" onclick="fn_updateLeader()" style="flex: 1; height: 48px; background-color: #a582e8; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">인솔자 변경</button> -->
                        <button type="submit" class="btn-update" style="flex: 1; height: 48px; background-color: #bfa2db; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">캠페인 수정</button>
                        <button type="button" class="btn-delete" onclick="campaignRemove()" style="flex: 1; height: 48px; background-color: #d8b4e2; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">캠페인 삭제</button>
                    </div>
                </form>
            </div>
        </div>

        <script th:inline="javascript">
            // 전역 변수 설정
            const params = new URLSearchParams(location.search);
            const id = params.get("id");
            const form = document.getElementById("form");
            const leaderList = /*[[${leaderList}]]*/ [];
            const campaignSelect = /*[[${campaignSelect}]]*/ {};
            console.log("campaignSelect" + JSON.stringify(campaignSelect))
            // DOM 이 로드된 후 실행할 초기화 작업 모음
            document.addEventListener("DOMContentLoaded", function() {
                console.log("DOM이 준비되었습니다!");

                // 1. 인솔자 급여 및 포인트 초기값 세팅
                let initialPay = campaignSelect.leaderPay || "";
                let initialPoint = campaignSelect.leaderPoint || "";

                document.querySelectorAll(".sync-pay-pc").forEach(el => el.value = initialPay);
                document.querySelectorAll(".sync-point-pc").forEach(el => el.value = initialPoint);
                document.querySelectorAll(".sync-pay-mo").forEach(el => el.value = initialPay);
                document.querySelectorAll(".sync-point-mo").forEach(el => el.value = initialPoint);

                if(document.getElementById("leaderPay")) document.getElementById("leaderPay").value = initialPay;
                if(document.getElementById("leaderPoint")) document.getElementById("leaderPoint").value = initialPoint;

                // 2. 경호타입 및 기간 날짜 초기화
                if(campaignSelect.typeCode){
                    document.getElementById("securityType").value = campaignSelect.typeCode;
                    document.getElementById("typeCode").value = campaignSelect.typeCode;
                }

                const initialEventStr = campaignSelect.eventPeriodStr || "";
                const initialEventEnd = campaignSelect.eventPeriodEnd || "";
                const initialRstDate = campaignSelect.resultDate || "";

                document.querySelectorAll(".sync-event-str").forEach(el => el.value = initialEventStr);
                document.querySelectorAll(".sync-event-end").forEach(el => el.value = initialEventEnd);
                document.querySelectorAll(".sync-event-rst").forEach(el => el.value = initialRstDate);

                if(document.getElementById("eventPeriodStr")) document.getElementById("eventPeriodStr").value = initialEventStr;
                if(document.getElementById("eventPeriodEnd")) document.getElementById("eventPeriodEnd").value = initialEventEnd;
                if(document.getElementById("resultDate")) document.getElementById("resultDate").value = initialRstDate;

                // 3. 경호/진행/수행 및 시급/일급 라디오 버튼 초기화
                const securityTypeSelect = document.getElementById("securityType");
                if (securityTypeSelect) {
                    securityTypeChange(securityTypeSelect.value);
                    const checkedRadio = document.querySelector('input[name="wageChk"]:checked');
                    if (checkedRadio) {
                        checkedRadio.dispatchEvent(new Event('change'));
                    }
                }

                // 4. 기존 인솔자 목록 불러오기 (수정 모드)
                if (campaignSelect.leaderList && campaignSelect.leaderList.length > 0) {
                    for (let i = 0; i < campaignSelect.leaderList.length; i++) {
                        addLeaderForm(campaignSelect.leaderList[i]);
                    }
                } else {
                    // 기존 인솔자가 없으면 기본 빈 폼 1개 생성
                    addLeaderForm(null);
                }

                // 5. 드래그 앤 드롭 및 파일 업로드 이벤트 바인딩
                initImageUploadEvents();
            });

            function syncPay(inputElement) {
                const formGroup = inputElement.closest('.leader-form-group');
                const value = inputElement.value;

                // PC와 모바일 입력창 둘 다에 값을 적어줌
                formGroup.querySelector('.sync-pay-pc').value = value;
                formGroup.querySelector('.sync-pay-mo').value = value;
                // Hidden 필드에도 저장
                formGroup.querySelector('.leaderPay').value = value;
            }

            function syncPoint(inputElement) {
                const formGroup = inputElement.closest('.leader-form-group');
                const value = inputElement.value;
                console.log("syncPoint 호출됨, 값: ", value);
                // PC와 모바일 입력창 둘 다에 값을 적어줌
                formGroup.querySelector('.sync-point-pc').value = value;
                formGroup.querySelector('.sync-point-mo').value = value;
                // Hidden 필드에도 저장
                formGroup.querySelector('.leaderPoint').value = value;
            }
            // ==========================================
            // 1. 인솔자 관련 기능 함수들
            // ==========================================

            // [인솔자 변경] 버튼 클릭 시 AJAX 전송 (POST / @RequestBody 대응)
            function fn_updateLeader() {
                if (!confirm("인솔자 정보를 변경하시겠습니까?")) return;

                const csrfInput = document.querySelector('input[name="_csrf"]');
                const csrfToken = csrfInput ? csrfInput.value : '';
                const campaignId = document.getElementById("campaignId").value;

                const strDate = document.querySelector(".sync-event-str")?.value || "";
                const endDate = document.querySelector(".sync-event-end")?.value || "";
                const resultDate = document.querySelector(".sync-event-rst")?.value || "";

                console.log("기간 정보 : ", strDate, endDate, resultDate);

                const leaderSelect = [];
                document.querySelectorAll("#leaderContainer .leader-form-group").forEach((group) => {
                    const selectEl = group.querySelector(".sync-nm");
                    const idx = selectEl ? selectEl.value : "";

                    // '-- 선택하세요 --'가 아닌 경우
                    if (idx !== "") {
                        const leaderInfo = leaderList[idx]; // 전역 leaderList 참조
                        const leaderPh = group.querySelector(".sync-phone")?.value || "";
                        const leaderPay = group.querySelector(".sync-pay")?.value || "0";
                        const leaderPoint = group.querySelector(".sync-point")?.value || "0";

                        const leaderNo = group.querySelector(".leaderNo")?.value || (leaderInfo ? leaderInfo.id : "");
                        const leaderId = group.querySelector(".leaderId")?.value || (leaderInfo ? leaderInfo.userId : "");

                        leaderSelect.push({
                            campaignId: parseInt(campaignId),
                            leaderNo: leaderNo ? String(leaderNo) : "",
                            leaderId: leaderId ? String(leaderId) : "",
                            leaderNm: leaderInfo ? leaderInfo.userNm : "",
                            leaderPay: parseInt(leaderPay),
                            leaderPh: leaderPh,
                            leaderPoint: parseInt(leaderPoint)
                        });
                    }
                });

                if (leaderSelect.length === 0) {
                    alert("선택된 인솔자 정보가 없습니다.");
                    return;
                }

                console.log("전송할 인솔자 목록:", leaderSelect);

                fetch("/admin/leaderUpdate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRF-TOKEN": csrfToken
                    },
                    body: JSON.stringify({
                        campaignId: parseInt(campaignId),
                        eventPeriodStr : strDate,
                        eventPeriodEnd : endDate,
                        resultDate : resultDate,
                        leaderList: leaderSelect
                    })
                })
                .then(response => {
                    if (!response.ok) throw new Error("네트워크 응답 오류");
                    return response.json();
                })
                .then(data => {
                    if (data > 0 || data.success) {
                        alert("인솔자 정보가 성공적으로 변경되었습니다.");
                        location.reload();
                    } else {
                        alert("인솔자 변경 실패");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("처리 중 오류가 발생했습니다.");
                });
            }

            // 인솔자 선택 시 셀렉트박스 및 연락처/hidden 자동 채움
            function inputLeaderPhoneNumber(selectElement) {
                const idx = selectElement.value;
                const formGroup = selectElement.closest('.leader-form-group');

                const phoneInput = formGroup.querySelector('.sync-phone');
                const noInput = formGroup.querySelector('.leaderNo');
                const idInput = formGroup.querySelector('.leaderId');

                if (idx === "") {
                    phoneInput.value = "";
                    if (noInput) noInput.value = "";
                    if (idInput) idInput.value = "";
                    return;
                }

                const selectedLeader = leaderList[idx];
                if (selectedLeader) {
                    phoneInput.value = selectedLeader.phoneNum || '';
                    if (noInput) noInput.value = selectedLeader.id || '';
                    if (idInput) idInput.value = selectedLeader.userId || '';
                }
            }

            // 인솔자 폼 추가
            function addLeaderForm(leaderInfo) {
                const template = document.getElementById('leaderTemplate');
                const container = document.getElementById('leaderContainer');
                const clone = document.importNode(template.content, true);

                if (leaderInfo != null) {
                    const selectElement = clone.querySelector('.sync-nm');
                    const phoneInput = clone.querySelector('.sync-phone');
                    const payInput = clone.querySelectorAll('.sync-pay-pc, .sync-pay-mo');
                    const pointInput = clone.querySelectorAll('.sync-point-pc, .sync-point-mo');

                    if (phoneInput) phoneInput.value = leaderInfo.leaderPh || "";
                    payInput.forEach(input => input.value = leaderInfo.leaderPay || "");
                    pointInput.forEach(input => input.value = leaderInfo.leaderPoint || "");

                    const hCode = clone.querySelector('.leaderCode');
                    const hId = clone.querySelector('.leaderId');
                    const hNo = clone.querySelector('.leaderNo');
                    const hPay = clone.querySelector('.leaderPay');
                    const hPoint = clone.querySelector('.leaderPoint');

                    if (hCode) hCode.value = leaderInfo.leaderCode || "";
                    if (hId) hId.value = leaderInfo.leaderId || "";
                    if (hNo) hNo.value = leaderInfo.leaderNo || "";
                    if (hPay) hPay.value = leaderInfo.leaderPay || "0";
                    if (hPoint) hPoint.value = leaderInfo.leaderPoint || "0";

                    if (selectElement && leaderInfo.leaderNo) {
                        const targetIdx = leaderList.findIndex(l => l.id == leaderInfo.leaderNo);
                        if (targetIdx !== -1) selectElement.value = targetIdx;
                    }
                }

                container.appendChild(clone);
                reIndexLeaderForms();
            }

            // 인솔자 폼 삭제
            function removeLeaderForm(button) {
                const currentFormCount = document.querySelectorAll('.leader-form-group').length;
                if (currentFormCount <= 1) {
                    alert("최소 1명의 인솔자 정보는 입력해야 합니다.");
                    return;
                }

                const formGroup = button.closest('.leader-form-group');
                if (confirm("정말로 이 인솔자 정보를 삭제하시겠습니까?")) {
                    if (formGroup) {
                        formGroup.remove();
                        reIndexLeaderForms();
                    }
                }
            }

            // name="leaderList[i].필드명" 인덱스 재정렬
            function reIndexLeaderForms() {
                const forms = document.querySelectorAll('#leaderContainer .leader-form-group');
                forms.forEach((form, index) => {
                    const inputs = form.querySelectorAll('[name]');
                    inputs.forEach(input => {
                        const currentName = input.getAttribute('name');
                        if (currentName) {
                            const newName = currentName.replace(/leaderList\[\d*\]/, `leaderList[${index}]`);
                            input.setAttribute('name', newName);
                        }
                    });
                });
            }

            // ==========================================
            // 2. 캠페인 수정 / 삭제 / 공통 기능 함수들
            // ==========================================

            function campaignRemove() {
                if (!confirm('정말로 이 캠페인을 삭제하시겠습니까?')) return;
                form.action = '/admin/campaign06?id=' + id;
                form.submit();
            }

            function securityTypeChange(typeCode) {
                const wageRadio = document.getElementById("wageRadio");
                const hourlyPay = document.getElementById("hourlyPay");
                const hourlyPayInput = document.getElementById("hourlyPayInput");
                const dailyPay = document.getElementById("dailyPay");
                const dailyPayInput = document.getElementById("dailyPayInput");
                const workHours = document.getElementById("workHour");
                const timeInput = document.getElementById("timeInput");

                if (typeCode === "02") {
                    wageRadio.classList.remove("hidden");
                    // document.getElementById("roleType").innerText = '진행'
                    document.querySelectorAll('input[name="wageChk"]').forEach((radio) => {
                        radio.onchange = function() {
                            if (this.value === "01") {
                                dailyPay.classList.remove("hidden");
                                hourlyPay.classList.add("hidden");
                                timeInput.classList.add("hidden");

                                dailyPayInput.setAttribute("name", "campaignPay");
                                hourlyPayInput.removeAttribute("name");
                                workHours.value = "";
                                workHours.required = false;
                            } else if (this.value === "02") {
                                dailyPay.classList.add("hidden");
                                hourlyPay.classList.remove("hidden");
                                timeInput.classList.remove("hidden");

                                hourlyPayInput.setAttribute("name", "campaignPay");
                                dailyPayInput.removeAttribute("name");
                                workHours.required = true;
                            }
                        };
                    });
                } else {
                    wageRadio.classList.add("hidden");
                }
                document.getElementById("typeCode").value = typeCode;
            }

            function removeFile(element, fileId) {
                const csrfToken = document.querySelector('input[name="_csrf"]').value;
                const csrfHeaderToSend = "X-CSRF-TOKEN";

                let request = new XMLHttpRequest();
                request.onreadystatechange = function() {
                    if (request.readyState == request.DONE) {
                        if (request.status == 200 && request.responseText == 'SUCCESS') {
                            alert('파일 삭제 성공');
                            document.getElementById("existing-file-section").classList.add('hidden');
                            document.getElementById("drop-area").classList.remove('hidden');
                            document.getElementById("image").value = '';
                            document.getElementById("preview").classList.add('hidden');
                            document.getElementById("preview").src = "";
                        } else {
                            alert('파일 삭제 실패');
                        }
                    }
                };

                const url = `/admin/file/markDeleted/${fileId}`;
                request.open('POST', url, true);
                request.setRequestHeader(csrfHeaderToSend, csrfToken);
                request.send();
            }

            // 이미지 업로드 드래그앤드롭 이벤트 바인딩
            function initImageUploadEvents() {
                const dropArea = document.getElementById("drop-area");
                const imageInput = document.getElementById("image");
                const preview = document.getElementById("preview");

                if (!dropArea || !imageInput) return;

                dropArea.addEventListener("click", () => imageInput.click());
                dropArea.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    dropArea.style.backgroundColor = "#f3e7ff";
                });
                dropArea.addEventListener("dragleave", () => {
                    dropArea.style.backgroundColor = "transparent";
                });
                dropArea.addEventListener("drop", (e) => {
                    e.preventDefault();
                    dropArea.style.backgroundColor = "transparent";
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith("image/")) {
                        imageInput.files = e.dataTransfer.files;
                        showPreview(file);
                    }
                });

                imageInput.addEventListener("change", () => {
                    const file = imageInput.files[0];
                    if (file) showPreview(file);
                });

                function showPreview(file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        preview.src = e.target.result;
                        preview.classList.remove('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            }

            // 실시간 인풋 동기화 (이벤트 위임)
            document.addEventListener("input", function(e) {
                // 1. 급여 동기화 (PC <-> Mobile 동일 인솔자 내부)
                if (e.target.classList.contains('sync-pay-pc') || e.target.classList.contains('sync-pay-mo')) {
                    const val = e.target.value;
                    const row = e.target.closest('.leader-row'); // ★ 인솔자 감싸는 부모 클래스명으로 변경해주세요

                    if (row) {
                        row.querySelectorAll('.sync-pay-pc, .sync-pay-mo').forEach(el => el.value = val);
                    } else {
                        // 부모 행을 못 찾을 경우(단일 입력창) 처리
                        if (document.getElementById("leaderPay")) document.getElementById("leaderPay").value = val;
                    }
                }

                // 2. 포인트 동기화 (PC <-> Mobile 동일 인솔자 내부)
                if (e.target.classList.contains('sync-point-pc') || e.target.classList.contains('sync-point-mo')) {
                    const val = e.target.value;
                    const row = e.target.closest('.leader-row'); // ★ 인솔자 감싸는 부모 클래스명으로 변경해주세요

                    if (row) {
                        row.querySelectorAll('.sync-point-pc, .sync-point-mo').forEach(el => el.value = val);
                    } else {
                        if (document.getElementById("leaderPoint")) document.getElementById("leaderPoint").value = val;
                    }
                }

                if (e.target.classList.contains('sync-event-str')) {
                    const val = e.target.value;
                    if(document.getElementById("eventPeriodStr")) document.getElementById("eventPeriodStr").value = val;
                    document.querySelectorAll(".sync-event-str").forEach(el => el.value = val);
                }

                if (e.target.classList.contains('sync-event-end')) {
                    const val = e.target.value;
                    if(document.getElementById("eventPeriodEnd")) document.getElementById("eventPeriodEnd").value = val;
                    document.querySelectorAll(".sync-event-end").forEach(el => el.value = val);
                }

                if (e.target.classList.contains('sync-event-rst')) {
                    const val = e.target.value;
                    if(document.getElementById("resultDate")) document.getElementById("resultDate").value = val;
                    document.querySelectorAll(".sync-event-rst").forEach(el => el.value = val);
                }
            });

            // 폼 제출 전 검증/보정
            if (form) {
                form.addEventListener('submit', function() {
                    const recruitInput = document.querySelector('input[name="recruitmentNum"]');
                    if (recruitInput && recruitInput.value === "") {
                        recruitInput.value = "0";
                    }
                });
            }
        </script>
    </body>
