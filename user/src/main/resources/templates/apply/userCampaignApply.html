<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>행집 명단 확인</title>
    <link rel="stylesheet" href="/mobile/css/style.css" />
</head>
<body class="bodyApply">
    <input type="hidden" id="workHour" name="workHour" th:value="${workHour}">
    <input type="hidden" id="wageChk" name="wageChk" th:value="${wageChk}">

    <div th:if="${not #lists.isEmpty(userCampaignApply)}">
        <div id="campaignArea" th:data-campaign-id="${userCampaignApply[0].campaignId}">
            <div id="campaignIdDown" th:data-campaign-id="${userCampaignApply[0].campaignId}">
                <div id="campaignTitleDown" th:data-campaign-title="${userCampaignApply[0].campaignTitle}">
                    <div class="notice-box">
                        <h2 th:if="${userCampaignApply != null}" th:text="${userCampaignApply[0].campaignTitle}"></h2>
                        <strong>신청자 / 모집인 수 : </strong><strong th:text="${userCampaignApply[0].applicantsNum}"></strong> / <strong th:text="${userCampaignApply[0].recruitmentNum}"></strong><br />
                        <strong>업체명 : </strong><strong th:text="${userCampaignApply[0].companyNm}"></strong><br>
                        <strong> 담당자 번호 : </strong><strong th:text="${userCampaignApply[0].companyPh}"></strong>
                        <p><strong>기간</strong><br />
                            <strong th:text="${userCampaignApply[0].eventPeriodStr}"></strong> ~ <strong th:text="${userCampaignApply[0].eventPeriodEnd}"></strong>
                        </p>
                        <p>
                            <strong>근무 형태 : </strong><strong th:text="${userCampaignApply[0].timeSegment == 'DAY' ? '주간' : '야간'}"></strong>
                        </p>
                        <a th:class="|review_btn|"
                                    href="#"
                                    th:data-url="@{/apply/popup01/{campaignId}(campaignId=${userCampaignApply[0].campaignId})}"
                                    th:onclick="|openPopup(this.dataset.url); return false;|">캠페인 신청</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(userCampaignApply)}" class="section">
        <p>해당 날짜에는 신청자가 없습니다.</p>
    </div>
    <div class="section">
        <label for="dateSelector">신청 일자 선택 :</label>
        <select class="date_Select" id="dateSelector" th:onchange="location.href='/apply/userCampaignApply/' + [[${campaignId}]] + '?date=' + this.value">
            <option value="">날짜를 선택하세요</option>
            <option th:each="item : ${applyDate}"
                    th:value="${item.applyDate}"
                    th:text="${item.applyDate}"
                    th:selected="${item.applyDate == currentDate}"> </option>
        </select>
        <div th:if="${reviewId == null}">
            <!-- <a th:if="${#authorization.expression('isAuthenticated()')}"
                class="review_btn"
                th:href="@{/review03/{id}(id=${campaignId})}">리뷰 등록</a>

            <a th:if="${!#authorization.expression('isAuthenticated()')}"
                class="review_btn"
                th:href="@{/user01(target='/review03/' + ${campaignId})}">리뷰 등록</a> -->
            <a class="review_btn" th:href="@{/review03/{id}(id=${campaignId})}">리뷰 등록</a>
        </div>
        <div class="pd-b20">
            <button type="button" class="people-checked" onclick="processAttendance('1')" style="background-color: green;">체크 출근</button>
            <button type="button" class="people-checked" onclick="processAttendance('2')" style="background-color: red;">체크 퇴근</button>
            <button type="button" class="people-checked" onclick="processAttendance('3')" style="background-color: blue;;">체크 특이사항</button>
        </div>
    </div>

    <div class="section applicant-list-area user-List">
        <div class="list-header">
            <span>신청자 수 : <span th:text="${#lists.size(userCampaignApply) - #lists.size(leaderList)}">0</span>명</span>
        </div>
        <p>현재 사용자 ID : <span th:text="${userId}">guest</span></p>
        <div class="applicant-item3">
            <div class="applicant-info">
                <label>
                    <input type="checkbox" class="chkAll" id="checkAll" name="checkAll" onclick="toggleAll(this)"><span class="checkAllfont">전체선택</span>
                </label>
                <div class="width100 mrg-b5 applicant-item" th:each="userCampaign, stat: ${userCampaignApply}" th:data-applicant-user-no="${userCampaign.userNo}"
                th:data-choose-status="${userCampaign.status}"> <!-- ⭐ userCampaign의 현재 status 값을 데이터 속성으로 추가 ⭐ -->
                    <div class="applyInfo" th:with="index=${stat.index}, userId=${userCampaign.userId}, currentUserNo=${userCampaign.userNo}, campaignId=${userCampaign.campaignId}, applyDate=${userCampaign.applyDate}">
                        <div th:unless="${userCampaign.status=='8' || userCampaign.status=='9'}">
                            <div th:if="${userCampaign.filePath == null}">
                                <input type="checkbox" class="chkSelect chkSelectUser" name="Attendance" th:data-user-no="${userCampaign.userNo}" th:data-user-id="${userCampaign.userId}" th:data-campaign-id="${userCampaign.campaignId}" th:data-apply-date="${userCampaign.applyDate}">
                                <img id="imgFile" src="/images/not-image.png" alt="파일이미지" width="50" height="50" />
                            </div>
                            <div class="width100" th:unless="${userCampaign.filePath == null}">
                                <input type="checkbox" class="chkSelect chkSelectUser" name="Attendance" th:data-user-no="${userCampaign.userNo}" th:data-user-id="${userCampaign.userId}" th:data-campaign-id="${userCampaign.campaignId}" th:data-apply-date="${userCampaign.applyDate}">
                                <img id="imgFile" th:src="|/selectProfile?id=${userCampaign.userNo}&args=profile|" alt="파일이미지" width="50" height="50" />
                            </div>
                            <div style="margin-left: 95px; margin-top: -60px;">
                                <span class="userInfofont" th:text="${userCampaign.userNm}"></span>/
                                <span th:text="${userCampaign.hyphenPhone}">010-0000-0000</span>
                                <button th:onclick="initStatus([[${index}]], [[${currentUserNo}]], [[${campaignId}]], [[${applyDate}]], '1')" th:class="|btn-state mrg5 button_status${stat.index}|">초기화</button>
                            </div>
                            <div class="btn-area-confirm">
                                <a th:class="|statusInfoChange statusInfoChangeConfirm button_status${stat.index}|" href="#" data-status="1" th:onclick="updateAttendanceStatus(this.dataset.status, [[${currentUserNo}]], [[${campaignId}]], [[${applyDate}]], [[${index}]])">출근</a>
                                <a th:class="|statusInfoChange statusInfoChangeConfirm button_status${stat.index}|" href="#" data-status="2" th:onclick="updateAttendanceStatus(this.dataset.status, [[${currentUserNo}]], [[${campaignId}]], [[${applyDate}]], [[${index}]])">퇴근</a>
                                <a th:class="|statusInfoChange statusInfoChangeConfirm button_status${stat.index}|"
                                    href="#"
                                    th:data-url="@{/apply/significant/{userNo}/{userId}/{campaignId}/{applyDate}(userNo=${currentUserNo}, userId=${userId}, campaignId=${campaignId}, applyDate=${applyDate})}"
                                    th:data-status="3" th:data-status-now="${userCampaign.status}"
                                    onclick="openSignificantModal(this); return false;">특이사항</a>
                                <div id="significantModal" onclick="closeModal(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
                                    <div style="background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%; position:relative;">
                                        <span onclick="closeSignificantModal();" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
                                        <div id="modalContent"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="significantModal" onclick="closeModal(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
                    <div style="background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%; position:relative;">
                        <span onclick="closeSignificantModal();" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
                        <div id="modalContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="section applicant-list-area leader-List">
        <div class="list-header">
            <span>인솔자 수 : <span th:text="${#lists.size(leaderList)}">0</span>명</span>
        </div>
        <div class="applicant-item3">
            <div class="applicant-info">
                <label>
                    <input type="checkbox" class="chkAll" id="checkAll" name="checkAllLeader" onclick="toggleAllLeader(this)"><span class="checkAllfont">전체선택</span>
                </label>
                <div class="width100 mrg-b5 applicant-item" th:each="leader, stat: ${leaderList}" th:data-applicant-user-no="${leader.userNo}"
                th:data-choose-status="${leader.status}">
                    <div class="applyInfo" th:with="index=${stat.index}, currentUserNo=${leader.userNo}, userId=${leader.userId}, campaignId=${leader.campaignId}, applyDate=${leader.applyDate}">
                        <div th:if="${leader.status=='8' || leader.status=='9'}">
                            <div th:if="${leader.filePath == null}">
                                <input type="checkbox" class="chkSelect chkSelectLeader" name="Attendance"th:data-user-no="${leader.userNo}" th:data-user-id="${leader.userId}" th:data-campaign-id="${leader.campaignId}" th:data-apply-date="${leader.applyDate}">
                                <img id="imgFile" src="/images/not-image.png" alt="파일이미지" width="50" height="50" />
                            </div>
                            <div class="width100" th:unless="${leader.filePath == null}">
                                <input type="checkbox" class="chkSelect chkSelectLeader" name="Attendance"th:data-user-no="${leader.userNo}" th:data-user-id="${leader.userId}" th:data-campaign-id="${leader.campaignId}" th:data-apply-date="${leader.applyDate}">
                                <img id="imgFile" th:src="|/selectProfile?id=${leader.userNo}&args=profile|" alt="파일이미지" width="50" height="50" />
                            </div>
                            <div style="margin-left: 95px; margin-top: -60px;">
                                <span class="userInfofont" th:text="${leader.userNm}"></span>/
                                <span th:text="${leader.hyphenPhone}">010-0000-0000</span>
                                <button th:onclick="initStatus([[${index}]], [[${currentUserNo}]], [[${campaignId}]], [[${applyDate}]], '2')" th:class="|btn-state mrg5 button_status${stat.index}|">초기화</button>
                            </div>
                                <div th:with="leaderUserNo=${leader.userNo}, leaderStatus=${leader.status}, leaderCampaignId=${leader.campaignId}, leaderApplyDate=${leader.applyDate}">
                                    <div class="btn-area-confirmA">
                                        <a th:class="|statusInfoChange statusInfoChangeConfirm button_status${stat.index}|"  th:data-user-no="${leader.userNo}" th:data-status="9" th:data-campaign-id="${leader.campaignId}" th:data-apply-date="${leader.applyDate}" th:onclick="leaveWork(this)">퇴근</a>
                                        <a th:class="|statusInfoChange statusInfoChangeConfirm button_status${stat.index}|" href="#" th:data-url="@{/apply/significant/{userNo}/{userId}/{campaignId}/{applyDate}(userNo=${currentUserNo}, userId=${userId}, campaignId=${campaignId}, applyDate=${applyDate})}" th:data-status="3" th:data-status-now="${leader.status}" onclick="openSignificantModal(this); return false;">특이사항</a>
                                    </div>
                                </div>
                                <div id="significantModal" onclick="closeModal(event)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
                                    <div style="background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%; position:relative;">
                                        <span onclick="closeSignificantModal();" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
                                        <div id="modalContent"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- <button type="button" class="btn-info" onclick="processAttendance('8')" style="background-color: red; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">인솔자 체크 퇴근</button> -->
        </div>
    </div>

    <div id="fileDownloadListSection" style="margin-top: 30px; padding: 15px; border-top: 1px solid #eee; display: none;">
        <h4><i class="fa fa-download" aria-hidden="true"></i> 다운로드 가능한 파일 목록</h4>
        <ul id="downloadLinksContainer" style="list-style: none; padding: 0;">
        </ul>
        <p id="noFilesMessage" style="color: #999; display: none;">다운로드할 파일이 없습니다.</p>
    </div>
    <div class="btn-area">
        <a class="btn-info" onclick="imgDownload('1')">신분증 사진<br>다운로드</a>
        <a class="btn-info" onclick="imgDownload('2')">이수증 사진<br>다운로드</a>
        <th:block th:if="${userCampaignApply != null and not #lists.isEmpty(userCampaignApply) and userCampaignApply[0].campaignId != null}">
            <a class="btn-info" type="button"
                    th:onclick="downloadExcel([[${userCampaignApply[0].campaignId}]], [[${userCampaignApply[0].applyDate}]], [[${userCampaignApply[0].timeSegment}]])">
                엑셀<br>다운로드
            </a>
        </th:block>
        <th:block th:unless="${userCampaignApply != null and not #lists.isEmpty(userCampaignApply) and userCampaignApply[0].campaignId != null}">
            <p>엑셀 다운로드 불가 (캠페인 정보 없음)</p>
        </th:block>
    </div>
    <div class="btn-area" th:if="${getPointInfo == 0}">
        <button class="btn-info" id="leaveWorkBtn">퇴근 포인트 적립하기</button>
    </div>
    <div id="modalPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; padding:20px; border-radius:8px; width:400px; max-width:90%; position:relative;">
            <span onclick="closeModalApply();" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
            <div id="modalContentUser"></div>
        </div>
    </div>
    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
        const userCampaignApply = /*[[${userCampaignApply}]]*/ [];
        const campId = /*[[${campaignId}]]*/ null;
    </script>
    <script th:src="@{/js/apply-confirm.js}" defer></script>
</body>
</html>
