<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <title>선정 인원 없는 캠페인</title>
        <link rel="stylesheet" th:href="@{/css/style.css}" />
        <!-- <link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.6/dist/web/variable/pretendardvariable.css" rel="stylesheet" /> -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <th:block th:replace="~{fragments/csrfFragments :: metaCsrf}"></th:block>
    </head>
    <body>
        <div class="admin-container">
            <!-- 사이드바 -->
            <div th:replace="~{fragments/sidebar :: sidebarFragment}"></div>
            <!-- 본문 영역 -->
            <div class="main-content">

                <h1><a th:href="@{/campaign07}">선정 인원 없는 캠페인</a></h1>
                <form class="optionForm" th:action="@{/campaign07}" method="get" id="form">

                    <div th:replace="~{fragments/csrfFragments :: inputCsrf}"></div>
                    <select name="code" class="wdt160">
                        <option value="0" th:selected="${option.code==0}">전체</option>
                        <option value="1" th:selected="${option.code==1}">제목</option>
                        <option value="2" th:selected="${option.code==2}">주소</option>
                        <option value="3" th:selected="${option.code==3}">리더자</option>
                    </select>
                    <select name="orderCode" id="order-code" class="wdt160">
                        <option value="0" th:selected="${option.orderCode == 0}">최신순</option>
                        <option value="1" th:selected="${option.orderCode == 1}">제목순</option>
                    </select>
                    <input type="text" name="keyword" placeholder="검색어를 입력해 주세요." th:value="${param.keyword}" style="width: 160px;">
                    <input class="optionSubmit" type="submit" value="검색">
                </form>

                <table class="info_table campaign_Table" border="1">
                    <colgroup>
                        <col width="5%"></col>
                        <col width="7%"></col>
                        <col width="7%"></col>
                        <col width="15%"></col>
                        <col width="15%"></col>
                        <col width="10%"></col>
                        <col width="10%"></col>
                        <col width="10%"></col>
                    </colgroup>
                    <thead>
                        <th>ID</th>
                        <th>캠페인 신청</th>
                        <th>상세보기</th>
                        <th>캠페인명</th>
                        <th>지역</th>
                        <th>상태</th>
                        <th>생성일</th>
                        <th>모집인원</th>
                    </thead>
                    <tbody>
                        <th:block th:if="${campaignsList.isEmpty()}">
                            <tr>
                                <td colspan="5" align="center">조회된 데이터가 없습니다.</td>
                            </tr>
                        </th:block>
                        <th:block th:each="campaign, stat : ${campaignsList}">
                            <tr>
                                <td><span th:text="${campaign.campaignId}"></span></td>
                                <td></td>
                                <!-- <td class="pointer">
                                    <a th:class="|statusInfoChange applyConfirmButotn|"
                                    href="#"
                                    th:data-url="@{/campPopup01/{campaignId}(campaignId=${campaign.campaignId})}"
                                    th:onclick="|openPopup(this.dataset.url, ${stat.index}); return false;|">캠페인 신청</a>
                                </td> -->
                                <td>
                                    <!-- <a th:href="|/campaign/select?id=${campaign.id}|">상세보기</a> -->
                                    <a th:href="@{/campaign02(id=${campaign.campaignId})}" target="_blank">상세 보기</a>
                                </td>
                                <td><span th:text="${campaign.campaignTitle}"></span></td>
                                <td><span th:text="${campaign.placeAddr}"></span></td>
                                <td><span th:text="${campaign.resultDate}"></span></td>
                                <td><span th:text="${campaign.createdAt}"></span></td>
                                <td><span th:text="${campaign.recruitmentNum}"></span></td>
                            </tr>
                        </th:block>
                    </tbody>
                </table>
                <div class="parent">
                    <div class="child">
                        <a th:href="@{${pageUrl} + '&page=' + ${page.first}}">[처음]</a>
                        <th:block th:if="${page.page != page.first }">
                            <a th:href="@{${pageUrl} + '&page=' + ${page.prev}}">[이전]</a>
                        </th:block>
                        <th:block th:each="no : ${#numbers.sequence(page.start, page.end)}">
                            <th:block th:if="${page.page == no}">
                                <b><span th:text="${no}"></span></b>
                            </th:block>
                            <th:block th:if="${page.page != no}">
                                <a th:href="@{${pageUrl} + '&page='+${no}}" th:text="${no}"></a>
                            </th:block>
                        </th:block>
                        <th:block th:if="${page.page != page.last }">
                            <a th:href="@{${pageUrl} + '&page=' + ${page.next}}">[다음]</a>
                        </th:block>
                        <a th:href="@{${pageUrl} + '&page=' + ${page.last}}">[마지막]</a>
                    </div>
                </div>
                <a th:href="@{/campaign/insert}" class="insert">등록</a>
            </div>
            <div id="modalPopup" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;">
                <div style="background:#fff; padding:20px 10px; border-radius:8px; width:400px; max-width:90%; position:relative;">
                    <span onclick="closeModal();" style="position:absolute; top:10px; right:15px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
        <script th:inline="javascript">
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            let campaign = /*[[${campaignsList}]]*/ null;
            let selectIndex = "";
            let chkInfo = new Set();
            let selectMap = new Map(); // key: userNo, value: userId
            let initialUser = new Set(); // 👈 최초 신청자 고정 보관함
        </script>
        <script th:src="@{/js/campaign.js}" defer></script>
    </body>
</html>
